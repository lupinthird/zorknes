# MMC1 SXROM: 128 KiB PRG (8 x 16 KiB), CHR-RAM, WRAM window at $6000

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    OAM:    start = $0200, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    WRAM:   start = $6000, size = $2000, type = rw, file = "";
    HDR:    start = $0000, size = $0010, file = %O, fill = yes;

    ROM0:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM1:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM2:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM3:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM4:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM5:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM6:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    ROM7:   start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    STORY0:   load = ROM0, type = ro;
    STORY1:   load = ROM1, type = ro;
    STORY2:   load = ROM2, type = ro;
    STORY3:   load = ROM3, type = ro;
    STORY4:   load = ROM4, type = ro;
    STORY5:   load = ROM5, type = ro;
    STORY6:   load = ROM6, type = ro;
    CODE:     load = ROM7, type = ro;
    RODATA:   load = ROM7, type = ro;
    VECTORS:  load = ROM7, type = ro, start = $FFFA;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
    OAM:      load = OAM,  type = bss;
    WRAM:     load = WRAM, type = bss, optional = yes;
}
